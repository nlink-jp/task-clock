# Example task definitions. Place files like this one in:
#   ~/.config/task-clock/tasks.d/<anything>.toml
# Each file may hold any number of [[task]] tables; task names must be
# unique across all files. Apply changes with:  task-clock reload

# The default form: an argv array, executed directly (no shell). ${VAR} is
# expanded by task-clock itself — from [task.env] first, then the daemon's
# environment — and an undefined variable is an error, never an empty string.
[[task]]
name    = "analyze"
cron    = "*/30 * * * *"
command = ["${HOME}/bin/run-analysis", "--incremental"]
workdir = "${HOME}/analysis"
timeout = "25m"
# log_max_mb: kill the run if its captured output exceeds this size (MB).
# Default 0 = no cap — protective kills are opt-in.
#log_max_mb = 50
# overlap:  queue-one (default) | skip | kill-and-restart
#   queue-one: a fire during a run waits and runs right after it (one deep)
#   skip:      a fire during a run is dropped (recorded as missed)
#   kill-and-restart: the running task is killed, the new fire runs
#overlap  = "queue-one"
# catch_up: run a fire that was delayed past its time (sleep, timer delay)
# as soon as it is noticed. Default true.
#catch_up = true

[task.env]
ANALYSIS_PROFILE = "batch"

# Watermark trigger: fire N after the last SUCCESS instead of on a cron
# grid. Built for variable-duration batch jobs (e.g. AI-agent launches):
# however a fire was lost, the elapsed-since-success condition re-arms.
# Mutually exclusive with cron; overlap/catch_up/jitter do not apply.
# A failing run retries one interval after its last attempt (no crash-loop).
[[task]]
name      = "ai-batch"
watermark = "30m"
command   = ["${HOME}/bin/agent-batch", "--incremental"]
timeout   = "25m"

# jitter spreads tasks sharing a cron expression: the start is delayed by a
# deterministic 0..jitter offset (hash of task name and fire time), so
# `task-clock status` still shows the exact planned start.
#[[task]]
#name    = "nightly-sync"
#cron    = "0 3 * * *"
#command = ["/usr/local/bin/sync-all"]
#jitter  = "5m"

# Shell form: opt in with shell = true and a single command string,
# interpreted by /bin/sh -c (the shell then owns quoting and expansion).
[[task]]
name    = "disk-report"
cron    = "0 7 * * 1"
shell   = true
command = "df -h | tee /tmp/disk-report.txt"

# A task kept defined but not scheduled:
#[[task]]
#name    = "paused-job"
#cron    = "0 3 * * *"
#command = ["/usr/local/bin/backup"]
#enabled = false
